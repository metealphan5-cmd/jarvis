<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>J.A.R.V.I.S.</title>

    <style>
        body {
            margin: 0;
            background: #02070d;
            color: #00d9ff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .jarvis {
            padding: 40px 20px;
        }

        h1 {
            font-size: 38px;
            letter-spacing: 8px;
            text-shadow: 0 0 20px #00d9ff;
        }

        .reactor {
            width: 180px;
            height: 180px;
            margin: 40px auto;
            border: 4px solid #00d9ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px #00d9ff;
            animation: pulse 2s infinite;
        }

        .core {
            width: 80px;
            height: 80px;
            background: #00d9ff;
            border-radius: 50%;
            box-shadow: 0 0 40px #00d9ff;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.1);
            }
        }

        button {
            padding: 14px 20px;
            margin: 8px;
            background: #062b3d;
            color: #00d9ff;
            border: 1px solid #00d9ff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #0a4058;
            box-shadow: 0 0 15px #00d9ff;
        }

        #result {
            margin: 25px auto;
            max-width: 700px;
            font-size: 18px;
            min-height: 40px;
            line-height: 1.6;
        }

        #wakeStatus {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="jarvis">

    <h1>J.A.R.V.I.S.</h1>

    <div class="reactor">
        <div class="core"></div>
    </div>

    <p id="status">SYSTEM ONLINE</p>

    <button onclick="jarvisSpeak()">
        🔊 JARVIS KONUŞ
    </button>

    <button onclick="listen()">
        🎤 BENİ DİNLE
    </button>

    <p id="wakeStatus">
        JARVIS bekleme modunda...
    </p>

    <p id="result">
        JARVIS hazır, efendim.
    </p>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>

let konusmaGecmisi = [
    {
        role: "system",
        content:
            "Sen JARVIS adında zeki ve yardımsever bir yapay zeka asistanısın. " +
            "Kullanıcı Türkçe konuşuyorsa Türkçe cevap ver. " +
            "Kullanıcıya efendim diye hitap et. " +
            "Asla hacı abi deme. " +
            "Cevaplarını doğal ve anlaşılır ver. " +
            "Cevaplarında yıldız, iki yıldız veya Markdown biçimlendirmesi kullanma. " +
            "Emoji kullanmamaya çalış."
    }
];

let wakeRecognition = null;
let wakeAktif = false;


// SES METNİNİ TEMİZLE
function sesMetniniTemizle(metin) {

    return metin
        .replace(/\*/g, "")
        .replace(/_/g, "")
        .replace(/#/g, "")
        .replace(/`/g, "")
        .replace(/[\u{1F300}-\u{1FAFF}]/gu, "")
        .replace(/[\u{2600}-\u{27BF}]/gu, "")
        .replace(/[\u{FE00}-\u{FE0F}]/gu, "")
        .replace(/\s+/g, " ")
        .trim();
}


// JARVIS KONUŞ
async function jarvisSpeak() {

    const result =
        document.getElementById("result");

    result.textContent =
        "JARVIS düşünüyor...";

    try {

        const cevap =
            await puter.ai.chat(
                "Merhaba JARVIS. Türkçe, doğal ve kısa bir şekilde selam ver. Kullanıcıya efendim diye hitap et.",
                {
                    model: "gpt-5.6-luna"
                }
            );

        let metin = "";

        if (cevap?.message?.content) {
            metin = cevap.message.content;
        } else {
            metin = String(cevap);
        }

        result.textContent =
            "JARVIS: " + metin;

        seslendir(metin);

    } catch (error) {

        console.error(error);

        result.textContent =
            "Hata oluştu: " + error;
    }
}


// SESLENDİR
function seslendir(metin) {

    const temizMetin =
        sesMetniniTemizle(metin);

    speechSynthesis.cancel();

    const ses =
        new SpeechSynthesisUtterance(temizMetin);

    ses.lang = "tr-TR";
    ses.rate = 0.9;
    ses.pitch = 1;

    speechSynthesis.speak(ses);
}


// NORMAL DİNLEME
function listen() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        document.getElementById("result").textContent =
            "Bu tarayıcı ses tanımayı desteklemiyor.";

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang = "tr-TR";
    recognition.continuous = false;
    recognition.interimResults = false;

    document.getElementById("result").textContent =
        "Dinliyorum efendim...";

    recognition.start();

    recognition.onresult =
        async function(event) {

            const text =
                event.results[0][0].transcript;

            document.getElementById("result").textContent =
                "Sen: " + text;

            await askJarvis(text);
        };

    recognition.onerror =
        function(event) {

            document.getElementById("result").textContent =
                "Mikrofon hatası: " +
                event.error;
        };
}


// JARVIS'A SOR
async function askJarvis(text) {

    const result =
        document.getElementById("result");

    result.textContent =
        "JARVIS düşünüyor...";

    try {

        konusmaGecmisi.push({
            role: "user",
            content: text
        });

        const cevap =
            await puter.ai.chat(
                konusmaGecmisi,
                {
                    model: "gpt-5.6-luna"
                }
            );

        let metin = "";

        if (cevap?.message?.content) {
            metin = cevap.message.content;
        } else {
            metin = String(cevap);
        }

        konusmaGecmisi.push({
            role: "assistant",
            content: metin
        });

        result.textContent =
            "JARVIS: " + metin;

        seslendir(metin);

    } catch (error) {

        console.error(error);

        result.textContent =
            "Hata oluştu: " + error;
    }
}


// "JARVIS" KELİMESİNİ BEKLE
function baslatWakeWord() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        document.getElementById("wakeStatus").textContent =
            "Bu tarayıcı otomatik aktivasyonu desteklemiyor.";

        return;
    }

    if (wakeAktif) {
        return;
    }

    wakeAktif = true;

    wakeRecognition =
        new SpeechRecognition();

    wakeRecognition.lang = "tr-TR";
    wakeRecognition.continuous = true;
    wakeRecognition.interimResults = false;

    wakeRecognition.onstart =
        function() {

            document.getElementById("wakeStatus").textContent =
                "JARVIS bekliyor... 'JARVIS' deyin.";
        };


    wakeRecognition.onresult =
        async function(event) {

            const sonSonuc =
                event.results[event.results.length - 1];

            const duyulan =
                sonSonuc[0].transcript
                    .toLowerCase()
                    .trim();

            console.log("Duyulan:", duyulan);


            if (duyulan.includes("jarvis")) {

                speechSynthesis.cancel();

                document.getElementById("wakeStatus").textContent =
                    "JARVIS AKTİF";

                document.getElementById("result").textContent =
                    "Sizi dinliyorum efendim...";


                let komut =
                    duyulan
                        .replace(/jarvis/gi, "")
                        .trim();


                if (komut.length > 0) {

                    await askJarvis(komut);

                    document.getElementById("wakeStatus").textContent =
                        "JARVIS bekliyor... 'JARVIS' deyin.";

                    return;
                }


                wakeRecognition.stop();

                setTimeout(function() {
                    komutDinle();
                }, 300);
            }
        };


    wakeRecognition.onerror =
        function(event) {

            console.log(
                "Wake word hatası:",
                event.error
            );

            if (
                event.error !== "not-allowed" &&
                event.error !== "service-not-allowed"
            ) {

                setTimeout(function() {

                    if (wakeAktif) {
                        baslatWakeWord();
                    }

                }, 1000);
            }
        };


    wakeRecognition.onend =
        function() {

            if (wakeAktif) {

                setTimeout(function() {

                    try {
                        wakeRecognition.start();
                    } catch (e) {
                    }

                }, 500);
            }
        };


    try {
        wakeRecognition.start();
    } catch (error) {
        console.log(error);
    }
}


// "JARVIS" DEDİKTEN SONRA KOMUTU DİNLE
function komutDinle() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        return;
    }

    const commandRecognition =
        new SpeechRecognition();

    commandRecognition.lang = "tr-TR";
    commandRecognition.continuous = false;
    commandRecognition.interimResults = false;

    document.getElementById("result").textContent =
        "Dinliyorum efendim...";


    commandRecognition.start();


    commandRecognition.onresult =
        async function(event) {

            const komut =
                event.results[0][0].transcript;

            document.getElementById("result").textContent =
                "Sen: " + komut;

            await askJarvis(komut);

            document.getElementById("wakeStatus").textContent =
                "JARVIS bekliyor... 'JARVIS' deyin.";
        };


    commandRecognition.onerror =
        function(event) {

            document.getElementById("result").textContent =
                "Mikrofon hatası: " +
                event.error;

            document.getElementById("wakeStatus").textContent =
                "JARVIS bekliyor... 'JARVIS' deyin.";

            setTimeout(function() {
                baslatWakeWord();
            }, 500);
        };


    commandRecognition.onend =
        function() {

            setTimeout(function() {
                baslatWakeWord();
            }, 500);
        };
}


// SAYFA AÇILDIĞINDA BEKLEMEYE BAŞLA
window.addEventListener(
    "load",
    function() {

        setTimeout(function() {
            baslatWakeWord();
        }, 1000);

    }
);

</script>

</body>
</html>
